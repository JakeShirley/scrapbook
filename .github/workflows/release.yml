name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  publish-image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release-version
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No release tag points at this commit; skipping image publish."
            exit 0
          fi
          version="${tag#v}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version $version from $tag."

      - name: Set up Node.js
        if: steps.release-version.outputs.published == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        if: steps.release-version.outputs.published == 'true'
        run: corepack enable pnpm

      - name: Install dependencies
        if: steps.release-version.outputs.published == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pin release version into package manifests
        if: steps.release-version.outputs.published == 'true'
        run: node scripts/set-package-version.mjs "${{ steps.release-version.outputs.version }}"

      - name: Generate full changelog
        if: steps.release-version.outputs.published == 'true'
        run: pnpm run generate:changelog

      - name: Set up Docker Buildx
        if: steps.release-version.outputs.published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release-version.outputs.published == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        if: steps.release-version.outputs.published == 'true'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release-version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish image
        if: steps.release-version.outputs.published == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SCRAPBOOK_VERSION=${{ steps.release-version.outputs.version }}
          push: true
          target: api
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest image provenance
        if: steps.release-version.outputs.published == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
