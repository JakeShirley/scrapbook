name: Container

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-smoke-test:
    name: Build And Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          target: api
          tags: scrapbook:smoke-test

      - name: Start container
        run: |
          docker run --detach --rm \
            --name scrapbook-smoke-test \
            --publish 4000:4000 \
            --env NODE_ENV=production \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=4000 \
            --env WEB_ORIGIN=http://127.0.0.1:4000 \
            scrapbook:smoke-test

      - name: Check API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health > /tmp/scrapbook-health.json; then
              cat /tmp/scrapbook-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs scrapbook-smoke-test
          exit 1

      - name: Check web shell
        run: curl --fail --silent http://127.0.0.1:4000/ > /tmp/scrapbook-index.html

      - name: Stop container
        if: always()
        run: docker stop scrapbook-smoke-test || true
