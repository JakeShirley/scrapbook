services:
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:4000
    ports:
      - "4000:4000"
    volumes:
      - scrapbook-data:/data/scrapbook
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:4000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  scrapbook-data:
